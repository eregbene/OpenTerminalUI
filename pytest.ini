[pytest]
addopts = --import-mode=importlib
testpaths = backend/tests
pythonpath = .
markers =
    mt5_offline: uses a fake MT5 bridge/broker responses only, no real terminal/account (runs automatically)
    mt5_demo_integration: touches the real, currently-connected MT5 INTERNAL_DEMO account (read-only ops freely; mutations require backend.brokers.mt5.test_mutation_safety.assert_safe_demo_mutation_test)
