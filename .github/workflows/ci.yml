name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Ephemeral test-only Postgres, isolated from any real environment -- available
    # via TEST_DATABASE_URL for destructive/integration tests (see
    # backend/shared/test_db_safety.py, docker-compose.test.yml). Never populated
    # from repo secrets or a developer .env; the name/credentials below are fixed,
    # throwaway, and destroyed at the end of every job run.
    services:
      postgres_test:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openterminalui_ci_test
          POSTGRES_USER: openterminalui_ci_test
          POSTGRES_PASSWORD: openterminalui_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openterminalui_ci_test -d openterminalui_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Explicit and unambiguous: CI never reads a developer .env, and DATABASE_URL
      # here is a plain ephemeral sqlite file scoped to the job workspace -- the
      # default test suite does not need real Postgres at all (see the isolated
      # in-memory sqlite pattern in backend/shared/test_db_safety.py). Any test that
      # genuinely needs Postgres opts in via TEST_DATABASE_URL, which points at the
      # `postgres_test` service above and is destroyed with the job.
      DATABASE_URL: "sqlite:///./ci_ephemeral_openterminalui.db"
      TEST_DATABASE_URL: "postgresql+psycopg://openterminalui_ci_test:openterminalui_ci_test@localhost:5432/openterminalui_ci_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Python compileall
        run: python -m compileall backend

      - name: Run pytest with coverage
        run: PYTHONPATH=. pytest backend/tests -q --cov=backend --cov-fail-under=45 --cov-report=xml --junitxml=pytest-report.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            pytest-report.xml
            coverage.xml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Frontend unit tests (Vitest)
        run: |
          cd frontend
          npx vitest run 2>&1 | tee vitest.log || true
          # Fail on actual test failures (✗ or FAIL markers)
          if grep -qE '^\s*[×✗]|FAIL\s' vitest.log; then
            echo "::error::Vitest tests had failures"
            exit 1
          fi
          # Ensure tests actually ran
          if ! grep -q '✓' vitest.log; then
            echo "::error::No passing tests found — vitest may not have run"
            exit 1
          fi
          echo "All Vitest tests passed"
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: |
          npm run test:e2e --prefix frontend

      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('coverage.xml', 'utf8');
            const m = xml.match(/line-rate=\"([0-9.]+)\"/);
            const pct = m ? (Number(m[1]) * 100).toFixed(2) : 'unknown';
            const body = `Backend coverage: **${pct}%** (threshold: 45%)`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
