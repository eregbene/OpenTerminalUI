      ADAPTIVE_PROFIT_PROTECT_EQUITY_PCT: "${ADAPTIVE_PROFIT_PROTECT_EQUITY_PCT:-0.75}"
      ADAPTIVE_STRONG_PROFIT_EQUITY_PCT: "${ADAPTIVE_STRONG_PROFIT_EQUITY_PCT:-1.00}"
      ADAPTIVE_ACCOUNT_PROFIT_LOCK_FRACTION: "${ADAPTIVE_ACCOUNT_PROFIT_LOCK_FRACTION:-0.30}"
      MFE_GIVEBACK_LIMIT_AFTER_1R: "${MFE_GIVEBACK_LIMIT_AFTER_1R:-0.50}"
      MFE_GIVEBACK_LIMIT_AFTER_1_5R: "${MFE_GIVEBACK_LIMIT_AFTER_1_5R:-0.35}"
      ADAPTIVE_MODIFICATION_COOLDOWN_SECONDS: "${ADAPTIVE_MODIFICATION_COOLDOWN_SECONDS:-120}"
      ATR_STOP_MULTIPLIER_MIN: "${ATR_STOP_MULTIPLIER_MIN:-0.8}"
      SPREAD_TO_STOP_MAX_RATIO: "${SPREAD_TO_STOP_MAX_RATIO:-0.333}"
      MAX_CORRELATED_OPEN_RISK_PCT: "${MAX_CORRELATED_OPEN_RISK_PCT:-0.75}"
      LIVE_TRADING_ENABLED: "${LIVE_TRADING_ENABLED:-false}"
      PROP_TRADING_ENABLED: "${PROP_TRADING_ENABLED:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openterminalui_data:/data
      # Read-only visibility into local Postgres backups (scripts/backup_postgres.ps1)
      # for GET /api/system/backup-status. Host path is outside the git repo and
      # outside any Docker-managed volume; adjust BENSIM_BACKUP_DIR if you keep
      # backups elsewhere. Missing directory is handled gracefully by the endpoint.
      - ${BENSIM_BACKUP_DIR:-C:/Users/Intel/Desktop/BensimBackups}:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./backend
        - action: rebuild
          path: ./frontend
        - action: rebuild
          path: ./config
        - action: rebuild
          path: ./data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    labels:
      com.bensim.product: "Bensim Trading"
      com.bensim.service: "redis"
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    labels:
      com.bensim.product: "Bensim Trading"
      com.bensim.service: "postgres"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-openterminalui}"
      POSTGRES_USER: "${POSTGRES_USER:-openterminalui}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-openterminalui}"
    ports:
      - "5432:5432"
    volumes:
      - openterminalui_postgres_data_recovered_20260807:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openterminalui} -d ${POSTGRES_DB:-openterminalui}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  openterminalui_data:
  # PRESERVED, NOT DELETED: this volume held the database wiped by the 2026-08-07
  # Base.metadata.drop_all() incident (see migration 0036_db_incident_boundary /
  # the db_incidents table). Kept as incident evidence and left declared here
  # (unused) so `docker compose down` never has a dangling-volume reason to prune
  # it. Do not remove this declaration and do not `docker volume rm` it.
  openterminalui_postgres_data:
  # The rebuilt database: fresh volume, schema created entirely via
  # `alembic upgrade head` (0001->0036), pre-incident survivor data (pcr_snapshots)
  # restored from pg_dump export. Created and migrated outside compose as
  # `openterminalui_postgres_recovered_20260807`; declared here as `external: true`
  # so compose attaches to that EXACT existing volume rather than creating a new
  # empty one under compose's own naming convention.
  openterminalui_postgres_data_recovered_20260807:
    external: true
    name: openterminalui_postgres_recovered_20260807
