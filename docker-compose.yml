      CALENDAR_MEDIUM_IMPACT_POST_WARNING_MINUTES: "${CALENDAR_MEDIUM_IMPACT_POST_WARNING_MINUTES:-10}"
      NEWS_HIGH_RISK_BLOCK_ENABLED: "${NEWS_HIGH_RISK_BLOCK_ENABLED:-true}"
      NEWS_ELEVATED_RISK_ACK_REQUIRED: "${NEWS_ELEVATED_RISK_ACK_REQUIRED:-true}"
      CONTEXT_STRICT_MODE: "${CONTEXT_STRICT_MODE:-true}"
      ADAPTIVE_TRADE_MANAGEMENT_ENABLED: "${ADAPTIVE_TRADE_MANAGEMENT_ENABLED:-true}"
