      MT5_LOSING_STREAK_COOLDOWN_HOURS: "${MT5_LOSING_STREAK_COOLDOWN_HOURS:-2.0}"
      MT5_CONCURRENT_EXPOSURE_CONFIRMATION_REQUIRED: "${MT5_CONCURRENT_EXPOSURE_CONFIRMATION_REQUIRED:-true}"
      MT5_CONCURRENT_EXPOSURE_MAX_ACCOUNTS: "${MT5_CONCURRENT_EXPOSURE_MAX_ACCOUNTS:-2}"
      MT5_CONCURRENT_EXPOSURE_SNAPSHOT_MAX_AGE_SECONDS: "${MT5_CONCURRENT_EXPOSURE_SNAPSHOT_MAX_AGE_SECONDS:-180}"
      MT5_BROKER_UTC_OFFSET_CACHE_SECONDS: "${MT5_BROKER_UTC_OFFSET_CACHE_SECONDS:-3600}"
      MT5_STRATEGY_ACTIVATION_SESSION_BREAKOUT: "${MT5_STRATEGY_ACTIVATION_SESSION_BREAKOUT:-}"
      MT5_STRATEGY_ACTIVATION_SUPPORT_RESISTANCE_BOUNCE: "${MT5_STRATEGY_ACTIVATION_SUPPORT_RESISTANCE_BOUNCE:-}"
      ADAPTIVE_PARTIAL_PROFIT_R: "${ADAPTIVE_PARTIAL_PROFIT_R:-0.5}"
      ADAPTIVE_PARTIAL_PROFIT_FRACTION: "${ADAPTIVE_PARTIAL_PROFIT_FRACTION:-0.25}"
      ADAPTIVE_TRAIL_R: "${ADAPTIVE_TRAIL_R:-1.5}"
      ADAPTIVE_MFE_MIN_R: "${ADAPTIVE_MFE_MIN_R:-0.5}"
      ADAPTIVE_MFE_FULL_CLOSE_R: "${ADAPTIVE_MFE_FULL_CLOSE_R:-1.0}"
      ADAPTIVE_MFE_EARLY_PARTIAL_FRACTION: "${ADAPTIVE_MFE_EARLY_PARTIAL_FRACTION:-0.5}"
