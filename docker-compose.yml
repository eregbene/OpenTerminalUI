      ADAPTIVE_MANAGEMENT_MODE: "${ADAPTIVE_MANAGEMENT_MODE:-shadow}"
      ADAPTIVE_BREAKEVEN_R: "${ADAPTIVE_BREAKEVEN_R:-1.0}"
      ADAPTIVE_THESIS_INVALIDATION_ENABLED: "${ADAPTIVE_THESIS_INVALIDATION_ENABLED:-true}"
      MT5_STRATEGY_ACTIVATION_MTFAI1: "${MT5_STRATEGY_ACTIVATION_MTFAI1:-}"
      MT5_MTFAI1_CONFIRMATION_REQUIRED: "${MT5_MTFAI1_CONFIRMATION_REQUIRED:-true}"
      MT5_MTFAI1_TREND_STRUCTURE_CONFIRMATION_REQUIRED: "${MT5_MTFAI1_TREND_STRUCTURE_CONFIRMATION_REQUIRED:-true}"
      MT5_MTFAI1_EQUAL_LEVEL_CONFIRMATION_REQUIRED: "${MT5_MTFAI1_EQUAL_LEVEL_CONFIRMATION_REQUIRED:-true}"
      MT5_MTFAI1_EQUAL_LEVEL_MIN_ATR_MULT: "${MT5_MTFAI1_EQUAL_LEVEL_MIN_ATR_MULT:-0.5}"
