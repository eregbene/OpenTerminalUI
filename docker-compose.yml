      # backend/historical_intelligence/modes.py. DEMO_ACTIVE only permits INFLUENCE where a
      # strategy's own trust_gating state AND a pattern's own statistical reliability both
      # separately clear their bars (see entry_intelligence.py/adaptive_intelligence.py); it is
      # not itself a blanket activation switch, and has no path to MT5_LIVE_TRADING_ENABLED
      # (independent, unrelated gate, unchanged above).
      HISTORICAL_INTELLIGENCE_MODE: "${HISTORICAL_INTELLIGENCE_MODE:-DEMO_ACTIVE}"
      # Opt-in launch of watchdog_historical_workers.py from entrypoint.sh (supervises the
      # long-running ForexSB/adaptive-backfill corpus-expansion workers so they survive a
      # container recreation). Off by default so other containers built from this same image
      # (docker-compose.test.yml, a future replica, etc.) don't unconditionally spawn
      # multi-hour background jobs; set to "1" on the environment that actually owns this work.
      ENABLE_HISTORICAL_WATCHDOG: "${ENABLE_HISTORICAL_WATCHDOG:-0}"
