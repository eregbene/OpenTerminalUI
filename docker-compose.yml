      ADAPTIVE_MANAGEMENT_ELIGIBLE_SYMBOLS: "${ADAPTIVE_MANAGEMENT_ELIGIBLE_SYMBOLS:-EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,USDCHF,NZDUSD,EURJPY,GBPJPY,XAUUSD}"
